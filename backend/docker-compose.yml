# Local Postgres for development and tests. One server, two databases:
#   splitease       -> dev  (DATABASE_URL in .env)
#   splitease_test  -> tests (created by docker/init-test-db.sql on first start)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: splitease
      # No password for local dev; safe only because the port is bound to localhost below.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d splitease"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
